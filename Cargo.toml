[package]
name = "search-core"
description = "Small shared traits for planning and search crates"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sunsided/search-core"
readme = "README.md"
keywords = ["search", "planning", "traits", "pathfinding"]
categories = ["algorithms", "no-std"]

[features]
default = ["alloc"]
## `Heuristic` for `Box<H>`.
alloc = []
## The checked float cost `NonNegF64`.
float = []

[dependencies]

[dev-dependencies]
# cargo_bench_support alone keeps plotters and rayon out.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.12"

[[bench]]
name = "cost"
harness = false
required-features = ["alloc"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/mermaid.html"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"
